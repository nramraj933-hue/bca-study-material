<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NR Store</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* Header & Navigation */
        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 12px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            transition: background 0.3s, color 0.3s;
            border-radius: 4px;
        }

        nav a:hover {
            background-color: #007bff;
            color: #fff;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-transform: capitalize;
            border-bottom: 2px solid #007bff;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* Product Card */
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            text-align: center;
            padding: 15px;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
        }

        .card h3 {
            margin: 15px 0 8px;
            font-size: 1.2rem;
            text-transform: capitalize;
        }

        .card .price {
            color: #28a745;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        .card button:hover {
            background-color: #0056b3;
        }

        /* Footer */
        footer {
            background-color: #1a1a1a;
            color: #aaa;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Header & Title -->
    <header>
        <h1>NR Store</h1>
    </header>

    <!-- Navigation Menu -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#image">Image</a>
        <a href="#shopping">Shopping</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Men's Collection -->
        <h2 class="section-title">Men's Collection</h2>
        <div class="grid">
            <div class="card">
                <img src="C:\ramrajnishad706\HTML" alt="Casual Shirt">
                <h3>Casual Shirt</h3>
                <p class="price">Price: $599</p>
                <button>Buy Now</button>
            </div>
            <div class="card">
                <img src="shirt.jpg" alt="Casual Jeans">
                <h3>Casual Jeans</h3>
                <p class="price">Price: $999</p>
                <button>Buy Now</button>
            </div>
        </div>

        <!-- Women's Collection -->
        <h2 class="section-title">Women's Collection</h2>
        <div class="grid">
            <div class="card">
                <img src="party.jpg" alt="Party Dress">
                <h3>Party Dress</h3>
                <p class="price">Price: $1999</p>
                <button>Buy Now</button>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 NR Store. All Rights Reserved.</p>
    </footer>

</body>
</html>
